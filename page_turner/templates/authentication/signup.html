{% extends 'base.html' %}

{% block main %}
<script src="https://cdn.tailwindcss.com"></script>

<section class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-2xl border border-gray-100">
        
        <div class="text-center">
            <div class="mx-auto h-12 w-12 bg-indigo-100 rounded-full flex items-center justify-center mb-4">
                <svg class="h-6 w-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Create your account</h2>
            <p class="mt-2 text-sm text-gray-500">Join our community of readers.</p>
        </div>

        <form class="mt-8 space-y-4" method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-gray-700 mb-1 leading-none">
                        {{ field.label }}
                    </label>
                    <div class="relative">
                        {{ field }}
                    </div>
                    {% if field.errors %}
                        <p class="text-xs text-red-500 mt-1 italic">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold shadow-md hover:bg-indigo-700 hover:shadow-lg transition-all transform active:scale-[0.98]">
                Start Reading
            </button>
        </form>

        <div class="pt-6 text-center border-t border-gray-100">
            <p class="text-sm text-gray-500">
                Already have an account? 
                <a href="{% url 'login' %}" class="text-indigo-600 font-semibold hover:underline">Login in</a>
            </p>
        </div>
    </div>
</section>

<style>
    /* This ensures Django's auto-generated inputs look professional */
    input {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid #e5e7eb;
        background-color: #f9fafb;
        outline: none;
        transition: all 0.2s ease-in-out;
    }
    input:focus {
        border-color: #4f46e5;
        background-color: #fff;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }
</style>
{% endblock %}
