{% extends 'base.html' %}
{% block main %}

{% load static %}

<div class="reader-container">
    <div class="reader-header">
        <div>
            <span class="section-label" style="margin-bottom: 0;">Digital Edition</span>
            <h1 class="reader-title">{{ book.title }}</h1>
        </div>
        
        <div class="reader-actions">
            <a href="{% url 'details' book.uuid %}" class="btn-main secondary" style="padding: 10px 20px; font-size: 11px;">
                <i class="bi bi-arrow-left me-2"></i> Exit Reader
            </a>
        </div>
    </div>

    <div class="reader-frame-wrapper">
        {% if book.digital_file %}
            <iframe
                src="{% static 'pdfjs/web/viewer.html' %}?file={{ pdf_url|urlencode }}"
                width="100%"
                height="800px"
                style="border:none; display: block;">
            </iframe>
        {% else %}
            <div class="text-center py-5">
                <h3 class="text-white">Digital file not found.</h3>
            </div>
        {% endif %}
    </div>

    <div class="mt-4 text-center">
        <p class="text-muted small" style="letter-spacing: 1px;">
            <i class="bi bi-shield-lock me-1"></i> SECURE DIGITAL ACCESS • SMART LIBRARY PRO
        </p>
    </div>
</div>

{% endblock %}
